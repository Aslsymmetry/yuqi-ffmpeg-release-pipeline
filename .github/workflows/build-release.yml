name: Build and optionally publish FFmpeg set

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets only from the exact protected release tag
        required: true
        default: false
        type: boolean
      reproducibility_check:
        description: Build twice in isolated roots and require exact binary hashes
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'ffmpeg-9.0.1-lame-3.100-r1'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload_build_output.outputs['artifact-id'] }}
      artifact-digest: ${{ steps.upload_build_output.outputs['artifact-digest'] }}
    env:
      SOURCE_DATE_EPOCH: '1786924800'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
          package-manager-cache: false
      - name: Assert official arm64 environment
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - run: npm ci --ignore-scripts
      - run: npm run sources:download
      - run: npm run sources:verify
      - run: npm run build
      - run: npm run verify:set
      - name: Generate ephemeral CI test key
        run: node scripts/generate-test-key.mjs /tmp/yuqi-ffmpeg-ci-test-key
      - name: Create and verify test-signed release assets
        shell: bash
        run: |
          export YUQI_FFMPEG_ED25519_PRIVATE_KEY_PEM="$(cat /tmp/yuqi-ffmpeg-ci-test-key/test-private.pem)"
          export YUQI_FFMPEG_ED25519_PUBLIC_KEY_PEM="$(cat /tmp/yuqi-ffmpeg-ci-test-key/test-public.pem)"
          npm run package
          node scripts/sign-manifest.mjs dist/yuqi-ffmpeg-9.0.1-lame-3.100-macos-arm64-r1.manifest.json dist/yuqi-ffmpeg-9.0.1-lame-3.100-macos-arm64-r1.manifest.sig
          node scripts/verify-manifest.mjs dist/yuqi-ffmpeg-9.0.1-lame-3.100-macos-arm64-r1.manifest.json dist/yuqi-ffmpeg-9.0.1-lame-3.100-macos-arm64-r1.manifest.sig /tmp/yuqi-ffmpeg-ci-test-key/test-public.pem
          node scripts/verify-release-package.mjs dist/yuqi-ffmpeg-9.0.1-lame-3.100-macos-arm64-r1.zip dist/yuqi-ffmpeg-9.0.1-lame-3.100-macos-arm64-r1.manifest.json
          npm test
          rm -rf /tmp/yuqi-ffmpeg-ci-test-key
      - id: upload_build_output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-build-output
          path: build/output/
          if-no-files-found: error
      - name: Require artifact identity outputs
        env:
          ARTIFACT_ID: ${{ steps.upload_build_output.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_build_output.outputs['artifact-digest'] }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"

  verify-artifact-handoff:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == false
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Download and verify exact build artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs['artifact-id'] }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs['artifact-digest'] }}
          EXPECTED_ARTIFACT_NAME: verified-build-output
          ARTIFACT_DESTINATION: build/output
        run: node scripts/download-build-artifact.mjs

  verify-reproducibility:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == false && inputs.reproducibility_check == true
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: '1786924800'
      YUQI_FFMPEG_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run sources:download
      - run: npm run sources:verify
      - name: Build twice in isolated clean roots
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/yuqi-repro-first"
          second="$RUNNER_TEMP/yuqi-repro-second"
          test "$first" != "$second"
          YUQI_FFMPEG_BUILD_ROOT="$first" YUQI_FFMPEG_OUTPUT="$first/output" YUQI_FFMPEG_TRACE_DIR="$first/trace" npm run build
          node scripts/verify-release-set.mjs "$first/output"
          YUQI_FFMPEG_BUILD_ROOT="$second" YUQI_FFMPEG_OUTPUT="$second/output" YUQI_FFMPEG_TRACE_DIR="$second/trace" npm run build
          node scripts/verify-release-set.mjs "$second/output"
          node scripts/compare-reproducibility.mjs "$first/trace" "$second/trace"

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: macos-15
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Require exact protected tag and signing secret
        env:
          SIGNING_KEY: ${{ secrets.YUQI_FFMPEG_ED25519_PRIVATE_KEY_PEM }}
        run: |
          test "$GITHUB_REF" = 'refs/tags/ffmpeg-9.0.1-lame-3.100-r1'
          test -n "$SIGNING_KEY"
      - name: Download and verify exact build artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs['artifact-id'] }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs['artifact-digest'] }}
          EXPECTED_ARTIFACT_NAME: verified-build-output
          ARTIFACT_DESTINATION: build/output
        run: node scripts/download-build-artifact.mjs
      - name: Verify production signing identity against pinned trust
        env:
          YUQI_FFMPEG_ED25519_PRIVATE_KEY_PEM: ${{ secrets.YUQI_FFMPEG_ED25519_PRIVATE_KEY_PEM }}
        run: npm run release:verify-key
      - name: Sign with protected release key
        env:
          YUQI_FFMPEG_ED25519_PRIVATE_KEY_PEM: ${{ secrets.YUQI_FFMPEG_ED25519_PRIVATE_KEY_PEM }}
        run: npm run release:sign
      - name: Recover or create verified Draft Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:draft
